<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), xr-spatial-tracking=(self)" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/brand/meta-echoes-icon-192.png" />
    <title>Scene Echoes</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #0a1628; color: #e8eef8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      #scene-container { position: fixed; inset: 0; }
      #landing {
        position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(circle at 50% 28%, #16325a, #0a1628 72%);
      }
      #landing[hidden] { display: none; }
      #brand-mark {
        width: min(72vw, 220px); height: auto; border-radius: 28px;
        background: #fff; padding: 18px 22px; box-sizing: border-box;
      }
      h1 { font-weight: 500; font-size: 42px; letter-spacing: 0.06em; margin: 0; }
      p { margin: 0; max-width: 28rem; text-align: center; color: #b7c6dc; line-height: 1.45; }
      #enter {
        width: min(86vw, 360px); height: 88px; border: 0; border-radius: 18px;
        font-size: 28px; font-family: inherit; letter-spacing: 0.04em;
        background: #dce8f8; color: #0a1628;
      }
      #enter:disabled { opacity: 0.45; cursor: not-allowed; }
      #support { color: #c9b58a; max-width: 26rem; text-align: center; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing">
      <img id="brand-mark" src="/assets/brand/meta-echoes-logo.png" alt="Meta Echoes" width="220" height="220" />
      <h1>Scene Echoes</h1>
      <p>Open in Meta Quest Browser. Allow cameras, then pinch Meta Echoes for Pictures and Movies.</p>
      <button id="enter" type="button">Enter</button>
      <p id="support" hidden></p>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
